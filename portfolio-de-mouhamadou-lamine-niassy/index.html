  <title>M.L. NIASSY | Portfolio</title>

  <!-- Favicon / Logo MLN -->

    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%230d347d'/%3E%3Cstop offset='100%25' stop-color='%233b76db'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Ctext x='50' y='59' text-anchor='middle' dominant-baseline='middle' font-family='Arial,sans-serif' font-size='27' font-weight='700' fill='white'%3EMLN%3C/text%3E%3C/svg%3E"
  >

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >


  <style>
    :root {
      --primary: #1557c0;
      --secondary: #79a8f2;
      --dark: #0F172A;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #1e293b;
      background-color: #ffffff;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .font-heading {
      font-family: 'Space Grotesk', sans-serif;
    }

    .mesh-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-color: #ffffff;

      background-image:
        radial-gradient(
          at 0% 0%,
          hsla(217,100%,95%,1) 0,
          transparent 50%
        ),
        radial-gradient(
          at 100% 0%,
          hsla(210,100%,90%,1) 0,
          transparent 50%
        ),
        radial-gradient(
          at 100% 100%,
          hsla(217,100%,97%,1) 0,
          transparent 50%
        ),
        radial-gradient(
          at 0% 100%,
          hsla(210,100%,95%,1) 0,
          transparent 50%
        );
    }

    .glass-nav {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    .text-glow {
      text-shadow: 0 0 30px rgba(21, 87, 192, 0.2);
    }

    .bento-card {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(226, 232, 240, 0.5);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .bento-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.9);
      border-color: var(--primary);
      box-shadow: 0 20px 40px -15px rgba(0, 102, 255, 0.1);
    }

    .btn-percutant {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .btn-percutant::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.2),
        transparent
      );
      transition: 0.5s;
    }

    .btn-percutant:hover::after {
      left: 100%;
    }
  </style>

</head>

<body>

  <div class="mesh-gradient"></div>

  <div id="root"></div>

  <script type="module" src="/index.tsx"></script>

</body>
</html>
